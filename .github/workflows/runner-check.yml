name: Runner check

# Temporary. Deleted as soon as it has answered its one question:
# will GitHub give this account a runner at all, or only not a macOS one?
#
# `iOS Tests` is currently failing in eight seconds with `runner_id: 0` and no
# steps -- the job is created and then never assigned a machine. That looks
# identical whether the cause is a macOS-specific restriction or an
# account-wide one, and the two need completely different fixes.
on:
  workflow_dispatch: {}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ubuntu runner allocated"

  mac:
    runs-on: macos-15
    steps:
      - run: echo "macOS runner allocated"
