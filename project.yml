name: EmailApp
options:
  bundleIdPrefix: com.abelamare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  EmailApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/EmailApp
    settings:
      base:
        # Registered on the Developer Portal under team TDMFXRJYN7.
        # Must match BUNDLE_ID in fastlane/Fastfile, Appfile and Matchfile.
        PRODUCT_BUNDLE_IDENTIFIER: emailapptest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Mail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Declares no non-exempt encryption. Without this TestFlight blocks
        # every build behind a manual export-compliance question.
        ITSAppUsesNonExemptEncryption: false

  EmailAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EmailAppTests
    dependencies:
      - target: EmailApp

schemes:
  EmailApp:
    build:
      targets:
        EmailApp: all
        EmailAppTests: [test]
    test:
      targets:
        - EmailAppTests
    archive:
      config: Release
