# Codemagic CI -- builds the iOS app on a macOS runner and ships it to TestFlight.
#
# There is no Mac anywhere in this loop:
#   * XcodeGen creates the .xcodeproj on the runner, so no .xcodeproj is committed
#   * signing uses an App Store Connect API key, so no certificate has to be
#     generated by hand in Keychain Access
#
# See README.md for the one-time Apple + Codemagic setup.

workflows:

  # Every push, any branch. Fast, no signing, no upload.
  ios-test:
    name: iOS Tests
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "EmailApp"
        XCODE_PROJECT: "EmailApp.xcodeproj"
    triggering:
      events:
        - push
        - pull_request
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      # Simulator names change with every Xcode release, so pick the newest
      # available iPhone at runtime instead of pinning a name that will rot.
      - name: Run unit tests
        script: |
          set -e
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in sorted(runtimes.items()):
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device['name'].startswith('iPhone'):
                      best = device['name']
          print(best)
          ")
          echo "Testing on: $DEVICE"
          xcode-project run-tests \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --device "$DEVICE"
    artifacts:
      - build/ios/test/*.xml
    test_report: build/ios/test/*.xml

  # Pushes to main. Signs the build and sends it to TestFlight.
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Name of the App Store Connect API key you add under
      # Codemagic -> Teams -> Integrations -> Developer Portal.
      app_store_connect: AppStoreConnectKey
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.abelamare.emailapp
      vars:
        XCODE_SCHEME: "EmailApp"
        XCODE_PROJECT: "EmailApp.xcodeproj"
        BUNDLE_ID: "com.abelamare.emailapp"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      # The bundle id lives in three places. Fail loudly rather than shipping
      # a build signed for the wrong identifier.
      - name: Check bundle id is in sync
        script: |
          set -e
          PROJECT_ID=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER:' project.yml | awk '{print $2}')
          SIGNING_ID=$(grep -m1 'bundle_identifier:' codemagic.yaml | awk '{print $2}')
          if [ "$PROJECT_ID" != "$BUNDLE_ID" ] || [ "$SIGNING_ID" != "$BUNDLE_ID" ]; then
            echo "Bundle id mismatch:"
            echo "  project.yml           = $PROJECT_ID"
            echo "  codemagic ios_signing = $SIGNING_ID"
            echo "  codemagic BUNDLE_ID   = $BUNDLE_ID"
            exit 1
          fi
          echo "Bundle id: $BUNDLE_ID"

      - name: Generate Xcode project
        script: xcodegen generate

      # PROJECT_BUILD_NUMBER is supplied by Codemagic and increments per build,
      # which is all App Store Connect requires (it rejects duplicates).
      - name: Set build number
        script: agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      # The project is generated during the build, so profiles have to be applied
      # after xcodegen rather than in Codemagic's automatic pre-build step.
      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers get builds with no App Review wait.
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - abelamare1633@gmail.com
        notify:
          success: true
          failure: true
