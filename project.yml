name: EmailApp
options:
  bundleIdPrefix: com.abelamare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:
  EmailApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/EmailApp
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        # Registered on the Developer Portal under team TDMFXRJYN7.
        # Must match BUNDLE_ID in fastlane/Fastfile, Appfile and Matchfile.
        PRODUCT_BUNDLE_IDENTIFIER: emailapptest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        # Sign in with Apple. The App ID carries APPLE_ID_AUTH and the
        # provisioning profile was regenerated afterwards, so the profile
        # grants this -- a profile minted before the capability would fail
        # to sign.
        CODE_SIGN_ENTITLEMENTS: Support/EmailApp.entitlements
    info:
      path: Support/Info.plist
      properties:
        # NOT "Mail" -- that is Apple's own app and App Store Connect rejects
        # the binary with ITMS-90129 ("bundle name or display name already
        # taken"). The upload succeeds and the build is discarded during
        # processing, so the only symptom is that nothing ever appears in
        # TestFlight. This matches the app record registered on App Store
        # Connect, which by definition cannot collide with anyone else.
        # Checked against the App Store before setting: no app is named exactly
        # "Maily" (there is a "Maily: AI Email Writer", which is a different
        # string), so this does not trip ITMS-90129 the way "Mail" did.
        CFBundleDisplayName: Maily
        CFBundleName: Maily
        # Xcode injects these automatically ONLY when it generates the
        # Info.plist. GENERATE_INFOPLIST_FILE is NO here, so they must be
        # declared by hand -- and without CFBundleIconName App Store Connect
        # accepts the upload and then silently discards the build during
        # processing (ITMS-90713), which looks exactly like "nothing happened".
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Google Sign-In. GIDClientID is read by the SDK at launch, and the
        # URL scheme is the client id with its dot-separated parts reversed --
        # Google redirects back to the app through it.
        GIDClientID: 154867130799-b46o1m27n9pnpe345urr9sv5sg24hc89.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.154867130799-b46o1m27n9pnpe345urr9sv5sg24hc89
        # Declares no non-exempt encryption. Without this TestFlight blocks
        # every build behind a manual export-compliance question.
        ITSAppUsesNonExemptEncryption: false

  EmailAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EmailAppTests
    dependencies:
      - target: EmailApp

schemes:
  EmailApp:
    build:
      targets:
        EmailApp: all
        EmailAppTests: [test]
    test:
      targets:
        - EmailAppTests
    archive:
      config: Release
